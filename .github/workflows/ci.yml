name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./... && go build -o llmux ./cmd/llmux

  # ── Architecture guard ──────────────────────────────────────────────────────
  arch:
    name: Arch guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Not go.mod's version: go-arch-lint v1.18 needs Go >= 1.25 to
          # install, and this module targets 1.24. The guard only reads the
          # import graph, so a newer toolchain is safe here.
          go-version: stable
          cache: true
      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.18.0
      - name: Check hexagonal boundaries
        run: go-arch-lint check

  # ── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 -timeout 120s ./...

  # ── Format ─────────────────────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd: $unformatted"
            echo "Run: go fmt ./..."
            exit 1
          fi

  # ── Vet ────────────────────────────────────────────────────────────────────
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  # ── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  # ── Tidy ───────────────────────────────────────────────────────────────────
  tidy:
    name: Module tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod; then
            echo "go.mod out of sync — run 'go mod tidy'"
            git diff -- go.mod
            exit 1
          fi
          if [ -f go.sum ] && ! git diff --quiet -- go.sum; then
            echo "go.sum out of sync — run 'go mod tidy'"
            git diff -- go.sum
            exit 1
          fi
