name: Build and publish image

on:
  push:
    branches: [master]
  # PRs build the image (no push) so a broken Dockerfile fails review, not
  # the first master build.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  # A newer push to a PR supersedes its build; master builds always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: meta
        run: |
          # Date-stamped tag matches the rest of gjcourt/* images (e.g.
          # ghcr.io/gjcourt/golinks:2026-05-02). The homelab deployment pins
          # the date+sha tag, the unique, immutable one; bump it there to roll
          # forward.
          DATE=$(date -u +%Y-%m-%d)
          SHA=${GITHUB_SHA::7}
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$DATE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$DATE-$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Only master publishes: a PR, or a manual run on another branch,
        # must not overwrite :latest or the date tag.
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
